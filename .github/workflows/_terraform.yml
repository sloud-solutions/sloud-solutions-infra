name: terraform (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: Stack directory under stacks/ (e.g. website, tools)
        type: string
        required: true
      environment:
        type: string
        required: true
      action:
        description: plan | apply
        type: string
        required: true

permissions:
  id-token: write # OIDC token for AWS; no static credentials anywhere
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Only `apply` binds to the protected environment (required reviewers).
    environment: ${{ inputs.action == 'apply' && inputs.environment || null }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_git_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: actions/setup-node@v4
        if: inputs.stack == 'tools'
        with:
          node-version: 22

      - name: Install Lambda dependencies
        if: inputs.stack == 'tools'
        run: |
          for dir in stacks/tools/lambda-src/*/; do
            (cd "$dir" && npm install --omit=dev --no-audit --no-fund)
          done

      - name: Render config
        run: bash scripts/render-config.sh "${{ inputs.environment }}" .rendered "${{ inputs.stack }}"

      - name: Validate config against schema
        run: pipx run check-jsonschema --schemafile config/schema.json .rendered/merged.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.action == 'apply' && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: stacks/${{ inputs.stack }}
        run: terraform init -input=false -backend-config=../../.rendered/backend.hcl

      - name: Validate
        working-directory: stacks/${{ inputs.stack }}
        run: terraform validate

      - name: Plan
        working-directory: stacks/${{ inputs.stack }}
        run: terraform plan -input=false -var-file=../../.rendered/stack.auto.tfvars.json -out=tfplan

      - name: Plan summary
        working-directory: stacks/${{ inputs.stack }}
        run: |
          {
            echo '### Terraform plan (${{ inputs.environment }})'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: stacks/${{ inputs.stack }}
        run: terraform apply -input=false tfplan
